<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#142026" />
    <title>Controle de Visitas</title>
    <link rel="icon" href="data:," />
  </head>
  <body class="bg-creme text-marinho antialiased">
    <a
      href="#lista"
      class="sr-only focus:not-sr-only focus:absolute focus:left-2 focus:top-2 focus:z-50 focus:rounded-lg focus:bg-white focus:px-3 focus:py-2 focus:shadow"
      >Ir para a lista de endereços</a
    >

    <header class="bg-marinho text-creme shadow">
      <div class="mx-auto w-full max-w-3xl px-4 py-4">
        <h1 class="text-xl font-bold sm:text-2xl">Controle de Visitas</h1>
        <p class="mt-1 text-sm text-creme/80">
          Selecione uma região e atualize os endereços
        </p>
      </div>
    </header>

    <main class="mx-auto w-full max-w-3xl px-4 pb-24 pt-4">
      <section aria-label="Resumo" class="mb-4">
        <ul id="resumo" class="grid grid-cols-2 gap-2 sm:grid-cols-4"></ul>
      </section>

      <section aria-label="Filtros" class="mb-4 space-y-3">
        <nav aria-label="Regiões">
          <div
            id="regioes"
            class="-mx-4 flex gap-2 overflow-x-auto px-4 pb-1"
            role="group"
          ></div>
        </nav>

        <div>
          <label for="status" class="mb-1 block text-sm font-semibold text-oceano"
            >Status</label
          >
          <select
            id="status"
            class="w-full rounded-xl border border-mar bg-white px-4 py-3 text-base text-marinho shadow-sm outline-none focus:border-oceano focus:ring-2 focus:ring-oceano"
          >
            <option value="todos">Todos</option>
            <option value="sem_resposta">Sem resposta</option>
            <option value="tem">Tem estrangeiro</option>
            <option value="nao_tem">Não tem estrangeiro</option>
          </select>
        </div>
      </section>

      <section id="lista" aria-live="polite" class="space-y-3"></section>
    </main>

    <div
      id="avisos"
      role="status"
      aria-live="polite"
      class="pointer-events-none fixed inset-x-0 bottom-0 z-40 flex flex-col items-center gap-2 p-4"
    ></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
